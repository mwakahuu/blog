services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/blog.sqlite
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PALMPESA_API_TOKEN: ${PALMPESA_API_TOKEN:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://wakubwa.chombezo.online}
      PALMPESA_CALLBACK_URL: ${PALMPESA_CALLBACK_URL:-https://wakubwa.chombezo.online/api/webhook/palmpesa}
      PALMPESA_CUSTOMER_EMAIL: ${PALMPESA_CUSTOMER_EMAIL:-daviskavenuke@gmail.com}
      PALMPESA_CUSTOMER_NAME: ${PALMPESA_CUSTOMER_NAME:-Juma Hassan Shaibu}
      PREMIUM_MEDIA_PROTECTION_CONFIRMED: ${PREMIUM_MEDIA_PROTECTION_CONFIRMED:-false}
    expose:
      - "3000"
    volumes:
      - blog_data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  blog_data:
  