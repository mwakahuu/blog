services:
  blog:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/blog.sqlite
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
